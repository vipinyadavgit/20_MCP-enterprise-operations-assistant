[project]
name = "20-mcp-enterprise-operations-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vipinyadavgit", email = "vipinyadav.git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq",
    "mcp>=1,<2",
    "python-dotenv",
    "streamlit",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/20_mcp_enterprise_operations_assistant"
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
